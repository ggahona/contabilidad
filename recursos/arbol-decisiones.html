<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌳 Árbol de Decisiones - ¿Qué cuenta uso?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  body {
    background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    background: white;
    border-radius: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
    color: white;
    padding: 25px 30px;
    text-align: center;
  }

  .header h1 { font-size: 2em; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .header p { opacity: 0.95; font-size: 1em; }

  .mode-tabs {
    display: flex;
    background: #f8f9fa;
    border-bottom: 2px solid #e9ecef;
  }

  .mode-tab {
    flex: 1;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
    border: none;
    background: transparent;
    font-size: 0.95em;
    color: #555;
  }

  .mode-tab:hover { background: #e9ecef; }

  .mode-tab.active {
    background: linear-gradient(135deg, #134e5e, #71b280);
    color: white;
  }

  .content-area {
    padding: 30px;
    min-height: 500px;
  }

  /* ASISTENTE MODE */
  .assistant-mode { display: none; }
  .assistant-mode.active { display: block; }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 12px;
    min-height: 50px;
    align-items: center;
  }

  .breadcrumb-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    background: white;
    border: 2px solid #71b280;
    border-radius: 20px;
    font-size: 0.85em;
    color: #134e5e;
    font-weight: 500;
  }

  .breadcrumb-item .arrow {
    color: #999;
    margin-left: 5px;
  }

  .question-box {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    border-left: 5px solid #4caf50;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
    animation: slideIn 0.5s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .question-box .question-icon {
    font-size: 2.5em;
    margin-bottom: 10px;
  }

  .question-box h3 {
    color: #1b5e20;
    font-size: 1.4em;
    margin-bottom: 8px;
  }

  .question-box p {
    color: #333;
    font-size: 1em;
    line-height: 1.5;
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }

  .option-btn {
    padding: 20px;
    background: white;
    border: 3px solid #e0e0e0;
    border-radius: 15px;
    cursor: pointer;
    font-size: 1em;
    text-align: left;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: #333;
  }

  .option-btn:hover {
    border-color: #4caf50;
    background: #f1f8e9;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(76,175,80,0.2);
  }

  .option-btn .option-icon {
    font-size: 1.8em;
    flex-shrink: 0;
  }

  .option-btn .option-text {
    flex: 1;
  }

  .option-btn .option-text strong {
    display: block;
    margin-bottom: 3px;
    color: #1b5e20;
  }

  .option-btn .option-text span {
    font-size: 0.85em;
    color: #666;
    font-weight: normal;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .action-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.9em;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .action-btn.back { background: #9e9e9e; color: white; }
  .action-btn.restart { background: linear-gradient(135deg, #ff6b35, #c1272d); color: white; }
  .action-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* RESULTADO */
  .result-box {
    background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    border: 3px solid #ff9800;
    border-radius: 20px;
    padding: 30px;
    animation: popIn 0.6s ease;
    text-align: center;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.8); }
    50% { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }

  .result-box .result-icon {
    font-size: 5em;
    margin-bottom: 15px;
    animation: bounce 1s ease;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .result-box h2 {
    color: #e65100;
    font-size: 2em;
    margin-bottom: 10px;
  }

  .result-box .account-type {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
    color: white;
    margin-bottom: 20px;
    font-size: 0.9em;
  }

  .type-activo { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .type-pasivo { background: linear-gradient(135deg, #eb3349, #f45c43); }

  .result-details {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: left;
    margin-top: 20px;
  }

  .result-details h4 {
    color: #e65100;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .result-details p {
    line-height: 1.6;
    color: #555;
    margin-bottom: 15px;
  }

  .movement-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
  }

  .movement-badge {
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }

  .movement-badge.aumenta {
    background: #d4edda;
    border-left: 4px solid #28a745;
    color: #155724;
  }

  .movement-badge.disminuye {
    background: #f8d7da;
    border-left: 4px solid #dc3545;
    color: #721c24;
  }

  .movement-badge strong {
    display: block;
    margin-bottom: 5px;
    font-size: 0.9em;
  }

  .example-box {
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    border-left: 4px solid #1976d2;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
  }

  .example-box strong {
    color: #0d47a1;
    display: block;
    margin-bottom: 5px;
  }

  /* MAPA MODE */
  .map-mode { display: none; }
  .map-mode.active { display: block; }

  .map-intro {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    text-align: center;
    border-left: 5px solid #4caf50;
  }

  .map-intro h3 {
    color: #1b5e20;
    margin-bottom: 10px;
  }

  .map-categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .map-category {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    border-top: 5px solid;
  }

  .map-category.activo-circulante { border-color: #38ef7d; }
  .map-category.activo-fijo { border-color: #6dd5ed; }
  .map-category.activo-diferido { border-color: #f2c94c; }
  .map-category.pasivo-circulante { border-color: #f45c43; }
  .map-category.pasivo-largo-plazo { border-color: #8e2de2; }

  .map-category-header {
    padding: 15px 20px;
    color: white;
    font-weight: bold;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .map-category.activo-circulante .map-category-header { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .map-category.activo-fijo .map-category-header { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
  .map-category.activo-diferido .map-category-header { background: linear-gradient(135deg, #f2994a, #f2c94c); }
  .map-category.pasivo-circulante .map-category-header { background: linear-gradient(135deg, #eb3349, #f45c43); }
  .map-category.pasivo-largo-plazo .map-category-header { background: linear-gradient(135deg, #8e2de2, #4a00e0); }

  .map-category-body {
    padding: 15px;
  }

  .map-account {
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #f8f9fa;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9em;
  }

  .map-account:hover {
    background: #e8f5e9;
    transform: translateX(5px);
  }

  .map-account .acc-icon {
    font-size: 1.3em;
  }

  .map-account .acc-name {
    font-weight: 500;
    color: #333;
  }

  .map-account .acc-hint {
    margin-left: auto;
    font-size: 0.8em;
    color: #999;
    font-style: italic;
  }

  /* START SCREEN */
  .start-screen {
    text-align: center;
    padding: 20px;
  }

  .start-screen .big-icon {
    font-size: 5em;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
  }

  .start-screen h2 {
    color: #134e5e;
    font-size: 2em;
    margin-bottom: 15px;
  }

  .start-screen .description {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 25px;
    line-height: 1.7;
    color: #333;
    border-left: 5px solid #4caf50;
  }

  .start-btn {
    padding: 15px 40px;
    background: linear-gradient(135deg, #134e5e, #71b280);
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .start-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(19,78,94,0.4);
  }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 30px;
  }

  .feature {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    border-top: 3px solid #71b280;
  }

  .feature-icon { font-size: 2em; margin-bottom: 8px; }
  .feature h4 { color: #134e5e; margin-bottom: 5px; font-size: 0.95em; }
  .feature p { color: #666; font-size: 0.85em; }

  .keyboard-hint {
    background: #f8f9fa;
    padding: 12px;
    border-radius: 10px;
    margin-top: 20px;
    font-size: 0.85em;
    color: #666;
  }

  .keyboard-hint kbd {
    background: #333;
    color: white;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
    margin: 0 2px;
  }

  /* Modal para detalles de cuenta desde el mapa */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: white;
    border-radius: 20px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    padding: 25px;
    background: linear-gradient(135deg, #134e5e, #71b280);
    color: white;
    border-radius: 20px 20px 0 0;
    position: relative;
    text-align: center;
  }

  .modal-header .close-btn {
    position: absolute;
    top: 15px; right: 15px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 35px; height: 35px;
    border-radius: 50%;
    font-size: 1.3em;
    cursor: pointer;
  }

  .modal-header .modal-icon { font-size: 3em; margin-bottom: 10px; }
  .modal-header h2 { font-size: 1.5em; }

  .modal-body { padding: 25px; }

  @media (max-width: 768px) {
    .header h1 { font-size: 1.5em; }
    .content-area { padding: 20px; }
    .question-box h3 { font-size: 1.2em; }
    .movement-row { grid-template-columns: 1fr; }
    .result-box h2 { font-size: 1.5em; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌳 Árbol de Decisiones</h1>
    <p>¿Qué cuenta contable debo usar? · Asistente interactivo</p>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode('assistant')">🎯 Asistente</button>
    <button class="mode-tab" onclick="switchMode('map')">🗺️ Mapa de Cuentas</button>
  </div>

  <div class="content-area">
    <!-- MODO ASISTENTE -->
    <div class="assistant-mode active" id="assistantMode">
      <div id="assistantContent"></div>
    </div>

    <!-- MODO MAPA -->
    <div class="map-mode" id="mapMode">
      <div class="map-intro">
        <h3>🗺️ Mapa completo de cuentas</h3>
        <p>Haz clic en cualquier cuenta para ver su información detallada</p>
      </div>
      <div class="map-categories" id="mapCategories"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <button class="close-btn" onclick="closeModal()">×</button>
      <div class="modal-icon" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ==================== ÁRBOL DE DECISIONES ====================
const decisionTree = {
  start: {
    question: "¿Qué tipo de operación estás registrando?",
    icon: "🤔",
    description: "Selecciona la categoría que mejor describe tu operación",
    options: [
      { text: "Operación con dinero", hint: "Efectivo, bancos, cheques", icon: "💵", next: "dinero" },
      { text: "Compra-venta de mercancías", hint: "Inventario, clientes, proveedores", icon: "🛒", next: "mercancias" },
      { text: "Adquisición de bienes de activo fijo", hint: "Terrenos, edificios, equipo", icon: "🏢", next: "activoFijo" },
      { text: "Inversiones financieras", hint: "Acciones, bonos, valores", icon: "📈", next: "inversiones" },
      { text: "Gastos pagados por anticipado", hint: "Seguros, rentas, propaganda", icon: "📅", next: "gastosDiferidos" },
      { text: "Obligaciones y deudas", hint: "Préstamos, impuestos, anticipos", icon: "💳", next: "pasivos" },
      { text: "Adeudos entre terceros", hint: "Préstamos, documentos", icon: "🤝", next: "adeudos" }
    ]
  },

  dinero: {
    question: "¿En qué forma se presenta el dinero?",
    icon: "💵",
    description: "Identifica la presentación específica del dinero",
    options: [
      { text: "Billetes y monedas en caja", hint: "Efectivo físico", icon: "💰", next: "caja" },
      { text: "Depósito en institución bancaria", hint: "Cheques, transferencias", icon: "🏦", next: "bancos" },
      { text: "Fondo para pagos menores", hint: "Máximo $2,000 LISR", icon: "🪙", next: "cajaChica" },
      { text: "Vouchers de tarjetas de crédito", hint: "Se consideran efectivo", icon: "💳", next: "caja" }
    ]
  },

  caja: {
    result: {
      name: "Caja",
      icon: "💵",
      type: "activo",
      typeLabel: "Activo Circulante",
      definition: "Dinero en efectivo propiedad de la empresa: monedas, billetes, cheques, vouchers de tarjetas, giros postales y bancarios.",
      aumenta: "Recibir dinero en efectivo",
      disminuye: "Pagar con efectivo",
      example: "Mía recibe $750 en efectivo por la venta de 30 tacos. Se carga Caja y se abona Ventas."
    }
  },

  bancos: {
    result: {
      name: "Bancos",
      icon: "🏦",
      type: "activo",
      typeLabel: "Activo Circulante",
      definition: "Valor de los depósitos en instituciones bancarias a favor de la entidad.",
      aumenta: "Depositar dinero o valores al cobro",
      disminuye: "Expedir cheques o transferencias",
      example: "Mía deposita $3,500 en BBVA. Se carga Bancos y se abona Caja."
    }
  },

  cajaChica: {
    result: {
      name: "Fondo Fijo de Caja Chica",
      icon: "🪙",
      type: "activo",
      typeLabel: "Activo Circulante",
      definition: "Dinero en efectivo para pagos menores. La LISR establece que no debe exceder $2,000.00.",
      aumenta: "Cuando el fondo se incrementa por ser insuficiente",
      disminuye: "Cuando el fondo se reduce por ser excesivo",
      example: "Mía constituye fondo de caja chica de $500 con cheque. Se carga Caja Chica y se abona Bancos."
    }
  },

  mercancias: {
    question: "¿La empresa está vendiendo o comprando mercancías?",
    icon: "🛒",
    description: "Define el tipo de operación con mercancías",
    options: [
      { text: "Vendiendo mercancías", hint: "Ingreso por ventas", icon: "💸", next: "vendiendo" },
      { text: "Comprando mercancías", hint: "Adquisición de inventario", icon: "📦", next: "comprando" },
      { text: "Anticipando pago a proveedor", hint: "Antes de recibir mercancía", icon: "💰", next: "anticipoProv" },
      { text: "Recibiendo anticipo de cliente", hint: "Antes de entregar mercancía", icon: "🎉", next: "anticipoCli" }
    ]
  },

  vendiendo: {
    question: "¿Cómo paga el cliente?",
    icon: "💸",
    description: "Identifica la forma de pago del cliente",
    options: [
      { text: "En efectivo o cheque", hint: "Pago inmediato", icon: "💵", next: "caja" },
      { text: "A crédito sin documento", hint: "Sin pagaré ni letra", icon: "👥", next: "clientes" },
      { text: "Con pagaré o letra de cambio", hint: "Con garantía documental", icon: "📄", next: "docsCobrar" }
    ]
  },

  clientes: {
    result: {
      name: "Clientes",
      icon: "👥",
      type: "activo",
      typeLabel: "Activo Circulante",
      definition: "Entidades que deben a la empresa por ventas de mercancías a crédito sin garantía documental.",
      aumenta: "Vender mercancías a crédito",
      disminuye: "Cobrar, recibir devoluciones o descuentos",
      example: "La Sra. Lupita debe $500 por 20 tacos a crédito. Se carga Clientes y se abona Ventas."
    }
  },

  docsCobrar: {
    result: {
      name: "Documentos por Cobrar",
      icon: "📄",
      type: "activo",
      typeLabel: "Activo Circulante",
      definition: "Títulos de crédito a favor de la entidad: letras de cambio y pagarés.",
      aumenta: "Recibir letras o pagarés a favor",
      disminuye: "Cobrar, endosar o cancelar documentos",
      example: "Don Juan firma pagaré por $1,250. Se carga Documentos por Cobrar y se abona Ventas."
    }
  },

  comprando: {
    question: "¿Cómo paga la empresa al proveedor?",
    icon: "📦",
    description: "Identifica la forma de pago al proveedor",
    options: [
      { text: "De contado (efectivo/cheque)", hint: "Pago inmediato", icon: "💵", next: "bancos" },
      { text: "A crédito sin documento", hint: "Sin pagaré ni letra", icon: "🥩", next: "proveedores" },
      { text: "Con pagaré o letra de cambio", hint: "Con garantía documental", icon: "📝", next: "docsPagar" }
    ]
  },

  proveedores: {
    result: {
      name: "Proveedores",
      icon: "🥩",
      type: "pasivo",
      typeLabel: "Pasivo Circulante",
      definition: "Entidades a quienes se debe por compras de mercancías a crédito sin garantía documental.",
      aumenta: "Comprar mercancías a crédito",
      disminuye: "Pagar, devolver mercancías o recibir descuentos",
      example: "Mía compra $3,000 en carne a crédito a Don Pedro. Se carga Mercancías y se abona Proveedores."
    }
  },

  docsPagar: {
    result: {
      name: "Documentos por Pagar",
      icon: "📝",
      type: "pasivo",
      typeLabel: "Pasivo Circulante",
      definition: "Títulos de crédito a cargo de la empresa: letras de cambio y pagarés.",

          </div>
          <div class="feature">
            <div class="feature-icon">⚡</div>
            <h4>Rápido</h4>
            <p>3-5 preguntas máximo</p>
          </div>
          <div class="feature">
            <div class="feature-icon">🔄</div>
            <h4>Flexible</h4>
            <p>Regresa y corrige el camino</p>
          </div>
        </div>
      </div>
    `;
    return;
  }
  
  const node = decisionTree[currentNode];
  
  // Si es resultado
  if (node.result) {
    renderResult(node.result);
    return;
  }
  
  // Si es pregunta
  let breadcrumbHTML = '';
  if (currentPath.length > 0) {
    breadcrumbHTML = '<div class="breadcrumb">';
    breadcrumbHTML += '<span style="color:#666; font-size:0.85em;">📍 Tu camino:</span>';
    currentPath.forEach((p, idx) => {
      const n = decisionTree[p];
      breadcrumbHTML += `<span class="breadcrumb-item">${n.icon || '📌'} ${n.question ? 'Pregunta ' + (idx+1) : n.result.name}</span>`;
    });
    breadcrumbHTML += '</div>';
  }
  
  let optionsHTML = '';
  node.options.forEach((opt, idx) => {
    optionsHTML += `
      <button class="option-btn" onclick="selectOption('${opt.next}', '${opt.text.replace(/'/g, "\\'")}')">
        <span class="option-icon">${opt.icon}</span>
        <span class="option-text">
          <strong>${opt.text}</strong>
          <span>${opt.hint}</span>
        </span>
      </button>
    `;
  });
  
  content.innerHTML = `
    ${breadcrumbHTML}
    <div class="question-box">
      <div class="question-icon">${node.icon}</div>
      <h3>${node.question}</h3>
      <p>${node.description}</p>
    </div>
    <div class="options-grid">
      ${optionsHTML}
    </div>
    <div class="action-buttons">
      <button class="action-btn back" onclick="goBack()" ${currentPath.length === 0 ? 'disabled' : ''}>
        ← Regresar
      </button>
      <button class="action-btn restart" onclick="restartAssistant()">
        🔄 Reiniciar
      </button>
    </div>
  `;
}

function renderResult(result) {
  const content = document.getElementById('assistantContent');
  
  let breadcrumbHTML = '<div class="breadcrumb">';
  breadcrumbHTML += '<span style="color:#666; font-size:0.85em;">✅ Resultado:</span>';
  currentPath.forEach((p, idx) => {
    const n = decisionTree[p];
    breadcrumbHTML += `<span class="breadcrumb-item">${n.icon || '📌'} Paso ${idx+1}</span>`;
  });
  breadcrumbHTML += `<span class="breadcrumb-item" style="background:#ff9800; color:white; border-color:#ff9800;">🎯 ${result.name}</span>`;
  breadcrumbHTML += '</div>';
  
  content.innerHTML = `
    ${breadcrumbHTML}
    <div class="result-box">
      <div class="result-icon">${result.icon}</div>
      <h2>${result.name}</h2>
      <span class="account-type type-${result.type}">${result.typeLabel}</span>
      
      <div class="result-details">
        <h4>📖 Definición</h4>
        <p>${result.definition}</p>
        
        <h4>📈 Movimientos</h4>
        <div class="movement-row">
          <div class="movement-badge aumenta">
            <strong>Aumenta por:</strong>
            ${result.aumenta}
          </div>
          <div class="movement-badge disminuye">
            <strong>Disminuye por:</strong>
            ${result.disminuye}
          </div>
        </div>
        
        <div class="example-box">
          <strong>🍳 Ejemplo práctico</strong>
          ${result.example}
        </div>
      </div>
    </div>
    
    <div class="action-buttons">
      <button class="action-btn back" onclick="goBack()">
        ← Regresar
      </button>
      <button class="action-btn restart" onclick="restartAssistant()">
        🔄 Nueva consulta
      </button>
    </div>
    
    <div class="keyboard-hint">
      💡 <strong>Tip:</strong> Usa <kbd>←</kbd> para regresar, <kbd>R</kbd> para reiniciar
    </div>
  `;
}

function startAssistant() {
  currentNode = 'start';
  currentPath = [];
  renderAssistant();
  // Avanzar automáticamente a la primera pregunta
  setTimeout(() => {
    currentPath.push('start');
    currentNode = decisionTree.start.options[0].next;
    // En realidad debemos mostrar la primera pregunta
    currentNode = 'start';
    currentPath = [];
    // Mostrar primera pregunta directamente
    currentPath.push('start');
    const firstQuestion = Object.keys(decisionTree).find(k => decisionTree[k].question && k !== 'start');
    // Mejor: mostrar start y que el usuario elija
    renderAssistant();
  }, 100);
}

function selectOption(nextNode, optionText) {
  currentPath.push(currentNode);
  currentNode = nextNode;
  renderAssistant();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (currentPath.length > 0) {
    currentNode = currentPath.pop();
    renderAssistant();
  }
}

function restartAssistant() {
  currentNode = 'start';
  currentPath = [];
  renderAssistant();
}

// ==================== MODO MAPA ====================
function renderMap() {
  const container = document.getElementById('mapCategories');
  container.innerHTML = '';
  
  Object.keys(allAccounts).forEach(catKey => {
    const cat = allAccounts[catKey];
    let accountsHTML = '';
    
    cat.accounts.forEach(acc => {
      accountsHTML += `
        <div class="map-account" onclick="showAccountDetail('${acc.id}')">
          <span class="acc-icon">${acc.icon}</span>
          <span class="acc-name">${acc.name}</span>
          <span class="acc-hint">Ver →</span>
        </div>
      `;
    });
    
    container.innerHTML += `
      <div class="map-category ${catKey}">
        <div class="map-category-header">
          ${cat.label}
        </div>
        <div class="map-category-body">
          ${accountsHTML}
        </div>
      </div>
    `;
  });
}

function showAccountDetail(accountId) {
  const node = decisionTree[accountId];
  if (!node || !node.result) return;
  
  const result = node.result;
  
  document.getElementById('modalIcon').textContent = result.icon;
  document.getElementById('modalTitle').textContent = result.name;
  
  document.getElementById('modalBody').innerHTML = `
    <div style="text-align:center; margin-bottom:15px;">
      <span class="account-type type-${result.type}">${result.typeLabel}</span>
    </div>
    <h4 style="color:#134e5e; margin-bottom:8px;">📖 Definición</h4>
    <p style="line-height:1.6; color:#555; margin-bottom:15px;">${result.definition}</p>
    
    <h4 style="color:#134e5e; margin-bottom:8px;">📈 Movimientos</h4>
    <div class="movement-row">
      <div class="movement-badge aumenta">
        <strong>Aumenta por:</strong>
        ${result.aumenta}
      </div>
      <div class="movement-badge disminuye">
        <strong>Disminuye por:</strong>
        ${result.disminuye}
      </div>
    </div>
    
    <div class="example-box">
      <strong>🍳 Ejemplo práctico</strong>
      ${result.example}
    </div>
  `;
  
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ==================== CAMBIO DE MODO ====================
function switchMode(mode) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  document.getElementById('assistantMode').classList.remove('active');
  document.getElementById('mapMode').classList.remove('active');
  
  if (mode === 'assistant') {
    document.getElementById('assistantMode').classList.add('active');
    renderAssistant();
  } else {
    document.getElementById('mapMode').classList.add('active');
    renderMap();
  }
}

// ==================== ATAJOS DE TECLADO ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
    if (document.getElementById('assistantMode').classList.contains('active')) {
      e.preventDefault();
      goBack();
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    if (document.getElementById('assistantMode').classList.contains('active')) {
      restartAssistant();
    }
  }
});

// Cerrar modal al hacer clic fuera
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// Inicializar
renderAssistant();
</script>
</body>
</html>
